<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      -webkit-app-region: drag;
      user-select: none;
    }
    .splash-container {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      border-radius: 20px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      width: 460px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    .app-name {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .app-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 30px;
    }
    .progress-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #a855f7, #7c3aed);
      background-size: 200% 100%;
      border-radius: 2px;
      animation: shimmer 1.5s infinite linear, grow 8s ease-out forwards;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes grow {
      0% { width: 0%; }
      30% { width: 40%; }
      60% { width: 70%; }
      90% { width: 85%; }
      100% { width: 95%; }
    }
    .status-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      min-height: 18px;
    }
    .version {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">🧠</div>
    <div class="app-name">AI Semester Companion</div>
    <div class="app-subtitle">Your Personal AI Study Partner</div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text" id="statusText">Initializing...</div>
    <div class="version">v1.0.0</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    ipcRenderer.on('status-update', (event, status) => {
      document.getElementById('statusText').textContent = status;
    });
  </script>
</body>
</html>
