services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-semester-companion
    ports:
      - "38173:38173"   # Frontend (Next.js)
      - "18080:18080"   # Backend  (FastAPI)
    volumes:
      - ./app-data:/app/app-data       # Persist DB, vectors, uploads
    env_file:
      - .env                           # API keys loaded from .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
