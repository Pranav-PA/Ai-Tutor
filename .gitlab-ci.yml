# ─────────────────────────────────────────────────────────────────────────────
# AI Learning Engine - GitLab CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # Container registry
  REGISTRY: $CI_REGISTRY
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

# ─── Cache Configuration ──────────────────────────────────────────────────────

.python_cache: &python_cache
  cache:
    key: python-${CI_COMMIT_REF_SLUG}
    paths:
      - backend/.venv/
      - backend/__pycache__/

.node_cache: &node_cache
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
      - frontend/.next/cache/

# ─── TEST STAGE ───────────────────────────────────────────────────────────────

test:backend:
  stage: test
  image: python:3.11-slim
  <<: *python_cache
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: learningagent_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/learningagent_test"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "test-secret-key"
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -m pytest tests/ -v --tb=short
  rules:
    - changes:
        - backend/**/*

test:frontend:
  stage: test
  image: node:20-alpine
  <<: *node_cache
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
    - npm run build
  rules:
    - changes:
        - frontend/**/*

# ─── BUILD STAGE ──────────────────────────────────────────────────────────────

build:backend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $BACKEND_IMAGE:latest .
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build:frontend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - docker build 
        --build-arg NEXT_PUBLIC_API_URL=$API_URL
        -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA 
        -t $FRONTEND_IMAGE:latest .
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ─── DEPLOY STAGE ─────────────────────────────────────────────────────────────

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_HOST << 'EOF'
        cd /opt/learning-engine
        docker-compose pull
        docker-compose up -d --remove-orphans
        docker system prune -f
      EOF
  environment:
    name: staging
    url: https://staging.learningengine.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PROD_USER@$PROD_HOST << 'EOF'
        cd /opt/learning-engine
        
        # Backup current images
        docker tag $BACKEND_IMAGE:current $BACKEND_IMAGE:rollback || true
        docker tag $FRONTEND_IMAGE:current $FRONTEND_IMAGE:rollback || true
        
        # Pull and deploy
        docker-compose pull
        docker-compose up -d --remove-orphans
        
        # Health check
        sleep 30
        curl -f http://localhost:8000/api/health || (
          echo "Health check failed, rolling back..."
          docker-compose down
          docker tag $BACKEND_IMAGE:rollback $BACKEND_IMAGE:latest
          docker tag $FRONTEND_IMAGE:rollback $FRONTEND_IMAGE:latest
          docker-compose up -d
          exit 1
        )
        
        # Tag as current
        docker tag $BACKEND_IMAGE:latest $BACKEND_IMAGE:current
        docker tag $FRONTEND_IMAGE:latest $FRONTEND_IMAGE:current
        
        docker system prune -f
      EOF
  environment:
    name: production
    url: https://learningengine.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
